<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Signal Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: "#0b0e14", panel: "#131722", edge: "#1e2532" } } } };
  </script>
  <style>
    body { background: radial-gradient(1200px 600px at 20% -10%, #16203a 0%, #0b0e14 55%); }
    .glow { box-shadow: 0 0 0 1px rgba(99,102,241,.12), 0 8px 40px -14px rgba(56,189,248,.22); }
    .card { background: rgba(19,23,34,.9); border: 1px solid #1e2532; border-radius: 16px; }
    ::-webkit-scrollbar { height: 8px; width: 8px; } ::-webkit-scrollbar-thumb { background:#273043; border-radius: 8px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen text-slate-200">
  <div class="mx-auto max-w-7xl px-4 py-6">
    <header class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold text-white">📡 Crypto <span class="text-indigo-400">Signal Engine</span></h1>
        <p class="text-sm text-slate-400">Trend-following signals across the top markets · entry · stop · targets · ETA · forecast</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="updated" class="text-xs text-slate-500"></span>
        <button id="btn-refresh" class="rounded-lg border border-edge bg-panel px-3 py-2 text-sm hover:bg-edge">↻ Rescan</button>
      </div>
    </header>

    <!-- Controls -->
    <div class="mb-4 flex flex-wrap items-center gap-3">
      <div id="tf-buttons" class="flex overflow-hidden rounded-lg border border-edge text-xs"></div>
      <div id="filter-buttons" class="flex overflow-hidden rounded-lg border border-edge text-xs"></div>
      <input id="search" placeholder="Filter coin… e.g. BTC" class="w-40 rounded-lg border border-edge bg-ink px-3 py-1.5 text-sm outline-none focus:border-indigo-500" />
      <span id="summary" class="ml-auto text-xs text-slate-400"></span>
    </div>

    <div id="signals" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    <p id="empty" class="hidden py-16 text-center text-slate-500"></p>

    <p class="mt-8 text-center text-xs text-slate-500">
      Free data: Binance · Coinbase · ExchangeRate. Trend-following signals are educational, not financial advice — always use your own stop.
    </p>
  </div>
  <script src="/app.js"></script>
</body>
</html>
